<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Core Ultra V6</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00e1; --bg: #050608; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        
        /* GİRİŞ EKRANI */
        #auth-view { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { background: rgba(255,255,255,0.03); border: 1px solid var(--neon); padding: 30px; border-radius: 25px; text-align: center; width: 100%; max-width: 350px; backdrop-filter: blur(10px); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #000; color: white; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: var(--neon); color: black; margin-top: 10px; }

        /* ANA EKRAN ÜST BAR */
        .top-bar { display: flex; align-items: center; padding: 15px; position: sticky; top: 0; background: rgba(5,6,8,0.8); backdrop-filter: blur(10px); z-index: 100; }
        .avatar-btn { width: 45px; height: 45px; background: linear-gradient(45deg, var(--neon), var(--pink)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: 0.3s; }
        .avatar-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--neon); }
        .user-info-mini { margin-left: 15px; }

        /* PROFİL PANELİ (MODAL) */
        #profile-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #111; border: 1px solid var(--pink); padding: 25px; border-radius: 20px; width: 100%; max-width: 320px; text-align: center; }

        /* İÇERİK */
        .content { padding: 20px; max-width: 450px; margin: 0 auto; }
        .xp-card { background: #111; padding: 15px; border-radius: 20px; border: 1px solid #222; margin-bottom: 20px; }
        .xp-bar { width: 100%; height: 10px; background: #000; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        #xp-fill { height: 100%; background: var(--neon); width: 0%; transition: 1s; }

        .task { background: #161616; padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; border: 1px solid transparent; transition: 0.2s; }
        .task.done { opacity: 0.3; border-color: #10b981; pointer-events: none; }
    </style>
</head>
<body>

<div id="auth-view">
    <div class="auth-box">
        <h2 id="auth-title" style="color:var(--neon)">CYBER-CORE</h2>
        <input type="text" id="user-input" placeholder="Kullanıcı Adı">
        <input type="password" id="pass-input" placeholder="Şifre">
        <button class="btn" onclick="handleAuth()">BAŞLAT</button>
        <p onclick="switchAuth()" id="switch-text" style="font-size:12px; color:#666; cursor:pointer; margin-top:15px;">Kayıt Ol</p>
    </div>
</div>

<div id="profile-modal">
    <div class="modal-content">
        <h3 style="color:var(--pink)">HESAP AYARLARI</h3>
        <p id="modal-user-name" style="font-weight:bold;"></p>
        <button class="btn" onclick="logout()" style="background:#333; color:white;">Çıkış Yap</button>
        <button class="btn" onclick="closeProfile()" style="background:none; color:#888; border:1px solid #444;">Kapat</button>
    </div>
</div>

<div id="app-view" style="display:none;">
    <div class="top-bar">
        <div id="nav-avatar" class="avatar-btn" onclick="openProfile()">?</div>
        <div class="user-info-mini">
            <div id="nav-name" style="font-weight:bold; font-size:14px;">AGENT</div>
            <div id="nav-lvl" style="font-size:12px; color:var(--neon)">LEVEL 1</div>
        </div>
    </div>

    <div class="content">
        <div class="xp-card">
            <div style="display:flex; justify-content:space-between; font-size:11px;">
                <span>GELİŞİM (XP)</span>
                <span id="xp-stat">0 / 1000</span>
            </div>
            <div class="xp-bar"><div id="xp-fill"></div></div>
        </div>

        <h4 style="font-size:11px; color:#444; letter-spacing:2px; margin-bottom:15px;">GÖREV DOSYALARI</h4>
        <div id="task-list"></div>
    </div>
</div>

<script>
    let isLoginMode = true;
    let player = null;
    const quests = [
        { id: 0, t: "Su İç", d: "Bir bardak su.", xp: 200, i: "💧" },
        { id: 1, t: "Şınav", d: "10 şınav çek.", xp: 300, i: "🦾" },
        { id: 2, t: "Mola", d: "1 dk gözlerini kapat.", xp: 150, i: "👁️" }
    ];

    function switchAuth() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "GİRİŞ" : "KAYIT";
        document.getElementById('switch-text').innerText = isLoginMode ? "Kayıt Ol" : "Giriş Yap";
    }

    function handleAuth() {
        const u = document.getElementById('user-input').value.trim();
        const p = document.getElementById('pass-input').value.trim();
        if(!u || !p) return alert("Eksik bilgi!");

        if(isLoginMode) {
            const saved = localStorage.getItem('cyber_v6_' + u);
            if(saved && JSON.parse(saved).pass === p) {
                player = JSON.parse(saved);
                enterApp();
            } else { alert("Hata!"); }
        } else {
            const data = { user: u, pass: p, xp: 0, lvl: 1, done: [] };
            localStorage.setItem('cyber_v6_' + u, JSON.stringify(data));
            alert("Kaydedildi!"); switchAuth();
        }
    }

    function enterApp() {
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        
        // Görevleri Kontrol Et: Eğer hepsi bitmişse otomatik sıfırla
        if(player.done.length >= quests.length) player.done = [];
        
        render();
    }

    function render() {
        document.getElementById('nav-avatar').innerText = player.user.charAt(0).toUpperCase();
        document.getElementById('nav-name').innerText = player.user.toUpperCase();
        document.getElementById('nav-lvl').innerText = "LEVEL " + player.lvl;
        document.getElementById('xp-stat').innerText = player.xp + " / 1000";
        document.getElementById('xp-fill').style.width = (player.xp / 10) + "%";

        const list = document.getElementById('task-list');
        list.innerHTML = '';
        quests.forEach(q => {
            const isDone = player.done.includes(q.id);
            const div = document.createElement('div');
            div.className = `task ${isDone ? 'done' : ''}`;
            div.innerHTML = `<span style="font-size:24px; margin-right:15px">${q.i}</span>
                             <div style="flex:1"><b>${q.t}</b><br><small style="color:#666">${q.d}</small></div>
                             <div style="color:var(--neon)">+${q.xp}</div>`;
            div.onclick = () => {
                if(!isDone) {
                    player.done.push(q.id);
                    player.xp += q.xp;
                    confetti({ particleCount: 100, spread: 60, origin: { y: 0.8 } });
                    if(player.xp >= 1000) { player.lvl++; player.xp -= 1000; }
                    save(); render();
                }
            };
            list.appendChild(div);
        });
    }

    function save() { localStorage.setItem('cyber_v6_' + player.user, JSON.stringify(player)); }
    function openProfile() { 
        document.getElementById('profile-modal').style.display = 'flex'; 
        document.getElementById('modal-user-name').innerText = "AGENT: " + player.user.toUpperCase();
    }
    function closeProfile() { document.getElementById('profile-modal').style.display = 'none'; }
    function logout() { location.reload(); }
</script>
</body>
</html>
