<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Core V12: Ghost Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00e1; --bg: #020204; }
        
        body { 
            font-family: 'Courier New', monospace; 
            background: var(--bg); color: white; margin: 0; overflow-x: hidden;
        }

        /* GLITCH EFEKTİ */
        .glitch { animation: glitch 1s linear infinite; }
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }

        /* TERMİNAL STİLİ GİRİŞ */
        #auth-view { position: fixed; inset: 0; z-index: 2000; background: black; display: flex; align-items: center; justify-content: center; }
        .terminal-box { width: 90%; max-width: 400px; padding: 20px; border: 1px solid var(--neon); box-shadow: 0 0 20px var(--neon); }
        
        input { 
            width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--neon);
            color: var(--neon); padding: 10px; outline: none; margin: 10px 0; font-family: 'Courier New';
        }

        /* ANA PANEL */
        .top-bar { padding: 20px; border-bottom: 1px dashed var(--neon); display: flex; justify-content: space-between; align-items: center; }
        .content { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* GİZLİ TERMİNAL */
        #cmd-line { 
            background: #000; color: #0f0; padding: 5px; font-size: 10px; 
            width: 100%; border: none; border-top: 1px solid #333; position: fixed; bottom: 0;
        }

        /* GÖREV KARTLARI */
        .task-card { 
            background: rgba(0, 242, 255, 0.05); border-left: 5px solid var(--neon);
            padding: 15px; margin-bottom: 15px; cursor: pointer; transition: 0.3s;
            position: relative; overflow: hidden;
        }
        .task-card:hover { background: rgba(0, 242, 255, 0.1); transform: translateX(10px); }
        .task-card.done { border-left-color: var(--pink); opacity: 0.4; }

        /* SEVİYE PLAKASI */
        .lvl-shield { 
            width: 60px; height: 60px; border: 2px solid var(--neon); 
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.05; pointer-events: none; }
    </style>
</head>
<body>

<canvas id="matrix" class="matrix-bg"></canvas>

<div id="auth-view">
    <div class="terminal-box">
        <h2 class="glitch">> CORE_ACCESS_REQUIRED</h2>
        <input type="text" id="user-input" placeholder="ID_IDENTIFIER">
        <input type="password" id="pass-input" placeholder="ENCRYPTION_KEY">
        <button onclick="Auth.handle()" style="background:var(--neon); color:black; border:none; padding:10px; width:100%; cursor:pointer; font-weight:bold;">INITIALIZE</button>
    </div>
</div>

<div id="app-view" style="display:none;">
    <div class="top-bar">
        <div class="lvl-shield" id="nav-lvl">1</div>
        <div style="text-align:right">
            <div id="nav-name" style="color:var(--neon); font-weight:bold;">AGENT_NULL</div>
            <div id="user-coins" style="font-size:12px;">0.00 BTC</div>
        </div>
    </div>

    <div class="content">
        <div style="margin-bottom:20px; font-size:11px; color:#555;">[ SYSTEM_STATUS: ONLINE ]</div>
        <div id="task-list"></div>
    </div>

    <input type="text" id="cmd-line" placeholder="TERMINAL_CMD: /help" onkeydown="Terminal.exec(event)">
</div>

<script>
// --- MATRIX ARKAPLAN EFEKTİ ---
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";
const fontSize = 10;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0f0";
    drops.forEach((y, i) => {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, y * fontSize);
        if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    });
}
setInterval(drawMatrix, 50);

// --- OYUN MANTIĞI ---
let player = null;
const quests = [
    { t: "BIO_SYNC", d: "Sıvı tüketimi yap.", xp: 200, i: "🔋" },
    { t: "CORE_STRENGTH", d: "10x Şınav protokolü.", xp: 400, i: "🦾" },
    { t: "EYE_REST", d: "Ekrana bakmadan 60 sn dur.", xp: 150, i: "👁️" }
];

const Auth = {
    handle: () => {
        const u = document.getElementById('user-input').value;
        const p = document.getElementById('pass-input').value;
        const saved = localStorage.getItem('cyber_v12_'+u);
        if(saved && JSON.parse(saved).pass === p) {
            player = JSON.parse(saved);
            UI.init();
        } else if(!saved) {
            player = { user: u, pass: p, xp: 0, lvl: 1, coins: 0, done: [] };
            localStorage.setItem('cyber_v12_'+u, JSON.stringify(player));
            UI.init();
        } else alert("ACCESS_DENIED");
    }
};

const UI = {
    init: () => {
        document.getElementById('auth-view').style.display='none';
        document.getElementById('app-view').style.display='block';
        UI.render();
    },
    render: () => {
        document.getElementById('nav-name').innerText = "AGENT_" + player.user.toUpperCase();
        document.getElementById('nav-lvl').innerText = player.lvl;
        document.getElementById('user-coins').innerText = (player.coins / 1000).toFixed(3) + " BTC";
        
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        quests.forEach((q, i) => {
            const isDone = player.done.includes(i);
            list.innerHTML += `
                <div class="task-card ${isDone?'done':''}" onclick="UI.complete(${i})">
                    <div style="font-weight:bold; color:var(--neon)">> ${q.t}</div>
                    <div style="font-size:11px; color:#888">${q.d}</div>
                </div>
            `;
        });
    },
    complete: (i) => {
        if(player.done.includes(i)) return;
        player.done.push(i);
        player.xp += quests[i].xp;
        player.coins += quests[i].xp;
        if(player.xp >= 1000) { player.lvl++; player.xp = 0; alert("LEVEL_UP: " + player.lvl); }
        localStorage.setItem('cyber_v12_'+player.user, JSON.stringify(player));
        UI.render();
    }
};

// --- GİZLİ TERMİNAL KOMUTLARI ---
const Terminal = {
    exec: (e) => {
        if(e.key === "Enter") {
            const cmd = e.target.value;
            if(cmd === "/hack-xp") {
                player.xp += 500;
                alert("XP_INJECTED");
            } else if(cmd === "/reset") {
                player.done = [];
            } else if(cmd === "/ghost") {
                document.body.style.filter = "invert(1) hue-rotate(180deg)";
            }
            e.target.value = "";
            UI.render();
        }
    }
};
</script>
</body>
</html>
