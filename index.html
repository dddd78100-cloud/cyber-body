<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siber-Çekirdek: Mor Versiyon</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        
        :root { 
            --ana-mor: #a855f7; 
            --acik-mor: #f3e8ff; 
            --yazi: #4c1d95;
            --arka-plan: #faf8ff;
        }
        
        body { 
            margin: 0; background: var(--arka-plan); color: var(--yazi); 
            font-family: 'Poppins', sans-serif; overflow-x: hidden;
            min-height: 100vh;
        }

        /* GİRİŞ EKRANI */
        #giris-ekrani { 
            position: fixed; inset: 0; z-index: 5000; background: white;
            display: flex; align-items: center; justify-content: center;
        }
        .giris-paneli { 
            background: var(--acik-mor); padding: 40px; border-radius: 30px; 
            text-align: center; width: 85%; max-width: 350px;
            box-shadow: 0 20px 40px rgba(168, 85, 247, 0.1);
        }

        input { 
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; 
            border: 2px solid white; background: white; color: var(--yazi);
            outline: none; box-sizing: border-box; font-family: 'Poppins';
        }

        /* ANA UYGULAMA */
        .ust-cubuk { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: white; border-bottom: 2px solid var(--acik-mor);
            position: sticky; top: 0; z-index: 100;
        }

        .seviye-karti { 
            background: var(--ana-mor); color: white; padding: 10px 20px;
            border-radius: 20px; font-weight: 800; box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }

        .icerik { max-width: 500px; margin: 0 auto; padding: 20px; }

        /* İLERLEME ÇUBUĞU */
        .puan-karti { 
            background: white; padding: 20px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); margin-bottom: 30px;
        }
        .cubuk-cerceve { height: 12px; background: var(--acik-mor); border-radius: 10px; margin: 10px 0; overflow: hidden; }
        #ilerleme-cubugu { height: 100%; width: 0%; background: linear-gradient(90deg, var(--ana-mor), #d8b4fe); transition: 1s ease-in-out; }

        /* GÖREV KARTLARI */
        .gorev-karti { 
            background: white; margin-bottom: 15px; padding: 20px; border-radius: 20px;
            display: flex; align-items: center; cursor: pointer; transition: 0.3s;
            border: 1px solid transparent;
        }
        .gorev-karti:hover { transform: scale(1.02); border-color: var(--ana-mor); }
        .gorev-karti.tamamlandi { opacity: 0.5; filter: grayscale(1); pointer-events: none; }

        .yenile-butonu { 
            background: var(--acik-mor); color: var(--ana-mor); border: none;
            width: 35px; height: 35px; border-radius: 10px; cursor: pointer; margin-left: auto;
        }

        .ana-buton { 
            width: 100%; padding: 15px; border: none; border-radius: 15px;
            background: var(--ana-mor); color: white; font-weight: bold;
            cursor: pointer; transition: 0.3s; font-family: 'Poppins';
        }
        .ana-buton:hover { background: #9333ea; transform: translateY(-2px); }
    </style>
</head>
<body>

<div id="giris-ekrani">
    <div class="giris-paneli">
        <h1 style="color: var(--ana-mor); margin: 0;">Çekirdek</h1>
        <p style="font-size: 12px; color: #a8a29e; margin-bottom: 20px;">KİŞİSEL GELİŞİM SİSTEMİ</p>
        <input type="text" id="kullanici" placeholder="Kullanıcı Adı">
        <input type="password" id="sifre" placeholder="Şifre">
        <button class="ana-buton" onclick="Sistem.giris()">SİSTEME GİR</button>
        <p onclick="Sistem.modDegistir()" id="mod-metni" style="font-size: 12px; margin-top: 15px; cursor: pointer;">Hesap Oluştur</p>
    </div>
</div>

<div id="ana-uygulama" style="display:none;">
    <div class="ust-cubuk">
        <div>
            <div id="isim" style="font-weight: 800; font-size: 18px;">OYUNCU</div>
            <div id="puan-yazi" style="font-size: 12px; color: var(--ana-mor);">0 Puan</div>
        </div>
        <div class="seviye-karti" id="seviye">Seviye 1</div>
    </div>

    <div class="icerik">
        <div class="puan-karti">
            <div style="display:flex; justify-content:space-between; font-size:12px; font-weight: bold;">
                <span>Gelişim Durumu</span>
                <span id="yuzde-metni">0%</span>
            </div>
            <div class="cubuk-cerceve"><div id="ilerleme-cubugu"></div></div>
        </div>

        <div id="gorev-listesi"></div>
        
        <div style="margin-top: 30px; text-align: center;">
            <button onclick="Sistem.yedekle()" style="background:none; border:none; color: #a8a29e; font-size: 12px; cursor: pointer;">Verileri İndir</button>
            <span style="color: #ddd;"> | </span>
            <button onclick="location.reload()" style="background:none; border:none; color: #a8a29e; font-size: 12px; cursor: pointer;">Çıkış Yap</button>
        </div>
    </div>
</div>

<script>
let veri = null;
const gorevHavuzu = [
    {baslik: "Su İç", detay: "Bir bardak taze su iç.", puan: 200, simge: "💧"},
    {baslik: "Kitap Oku", detay: "5 sayfa kitap oku.", puan: 300, simge: "📚"},
    {baslik: "Egzersiz", detay: "10 tane şınav çek.", puan: 400, simge: "💪"},
    {baslik: "Mola Ver", detay: "Gözlerini 1 dakika dinlendir.", puan: 150, simge: "🧘"},
    {baslik: "Yürüyüş", detay: "Evin içinde biraz turla.", puan: 250, simge: "🚶"}
];

const Sistem = {
    isLogin: true,
    modDegistir: () => {
        Sistem.isLogin = !Sistem.isLogin;
        document.getElementById('mod-metni').innerText = Sistem.isLogin ? "Hesap Oluştur" : "Giriş Yap";
    },
    giris: () => {
        const u = document.getElementById('kullanici').value;
        const s = document.getElementById('sifre').value;
        if(!u) return alert("İsim yazmalısın.");
        
        let kayitli = localStorage.getItem('mor_v14_'+u);
        if(kayitli) {
            veri = JSON.parse(kayitli);
            if(veri.s !== s) return alert("Şifre yanlış.");
        } else {
            veri = { u, s, seviye: 1, tecrube: 0, toplamPuan: 0, aktifGorevler: [] };
            Sistem.gorevOlustur();
        }
        Sistem.baslat();
    },
    baslat: () => {
        document.getElementById('giris-ekrani').style.display = 'none';
        document.getElementById('ana-uygulama').style.display = 'block';
        if(veri.aktifGorevler.length === 0) Sistem.gorevOlustur();
        Sistem.guncelle();
    },
    gorevOlustur: () => {
        let karisik = [...gorevHavuzu].sort(() => 0.5 - Math.random());
        veri.aktifGorevler = karisik.slice(0, 3).map((g, i) => ({...g, id: i, bitti: false}));
        Sistem.kaydet();
    },
    guncelle: () => {
        document.getElementById('isim').innerText = veri.u.toUpperCase();
        document.getElementById('seviye').innerText = "Seviye " + veri.seviye;
        document.getElementById('puan-yazi').innerText = veri.toplamPuan + " Puan";
        document.getElementById('ilerleme-cubugu').style.width = (veri.tecrube / 10) + "%";
        document.getElementById('yuzde-metni').innerText = "%" + (veri.tecrube / 10);
        
        const liste = document.getElementById('gorev-listesi');
        liste.innerHTML = '';
        veri.aktifGorevler.forEach(g => {
            const kart = document.createElement('div');
            kart.className = `gorev-karti ${g.bitti ? 'tamamlandi' : ''}`;
            kart.innerHTML = `
                <span style="font-size:30px; margin-right:20px;">${g.simge}</span>
                <div style="flex:1" onclick="Sistem.tamamla(${g.id})">
                    <b style="color:var(--yazi)">${g.baslik}</b><br>
                    <small style="color:#a8a29e">${g.detay}</small>
                </div>
                <button class="yenile-butonu" onclick="Sistem.tekliYenile(${g.id})">🔄</button>
            `;
            liste.appendChild(kart);
        });

        if(veri.aktifGorevler.every(g => g.bitti)) {
            liste.innerHTML += `<button class="ana-buton" style="margin-top:10px;" onclick="Sistem.gorevOlustur(); Sistem.guncelle();">YENİ GÖREVLERİ AL</button>`;
        }
    },
    tamamla: (id) => {
        let g = veri.aktifGorevler.find(x => x.id === id);
        if(g.bitti) return;
        g.bitti = true;
        veri.tecrube += g.puan;
        veri.toplamPuan += g.puan;
        confetti({ particleCount: 100, colors: ['#a855f7', '#d8b4fe'] });
        
        if(veri.tecrube >= 1000) {
            veri.seviye++;
            veri.tecrube -= 1000;
            alert("TEBRİKLER! Seviye Atladın: " + veri.seviye);
        }
        Sistem.kaydet();
        Sistem.guncelle();
    },
    tekliYenile: (id) => {
        let yeni = gorevHavuzu[Math.floor(Math.random()*gorevHavuzu.length)];
        veri.aktifGorevler = veri.aktifGorevler.map(x => x.id === id ? {...yeni, id: id, bitti: false} : x);
        Sistem.kaydet();
        Sistem.guncelle();
    },
    kaydet: () => localStorage.setItem('mor_v14_'+veri.u, JSON.stringify(veri)),
    yedekle: () => {
        const d = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(veri));
        const a = document.createElement('a'); a.href = d; a.download = "yedek.json"; a.click();
    }
};
</script>
</body>
</html>
