<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siber-Çekirdek V13: Neon Ruh</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #ff007a; --sub: #00d4ff; --bg: #0b0114; --card: rgba(255, 255, 255, 0.05); }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); color: white; margin: 0; overflow-x: hidden;
            background-image: radial-gradient(circle at top right, #1a0131, #0b0114);
            min-height: 100vh;
        }

        /* MODERN GİRİŞ */
        #auth-view { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: #0b0114; }
        .auth-card { 
            background: var(--card); border: 1px solid var(--sub); padding: 40px; border-radius: 30px; 
            text-align: center; backdrop-filter: blur(20px); box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
        }

        /* SİBER YOLDAŞ (AI) */
        .pet-box { 
            background: rgba(0, 0, 0, 0.4); border-radius: 20px; padding: 15px; 
            margin: 20px; display: flex; align-items: center; border: 1px solid var(--main);
            box-shadow: 0 0 15px rgba(255, 0, 122, 0.2);
        }
        #pet-icon { font-size: 40px; margin-right: 15px; animation: float 3s ease-in-out infinite; }
        #pet-text { font-size: 13px; color: var(--sub); font-weight: bold; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* ANA UI */
        .header { display: flex; justify-content: space-between; padding: 20px; align-items: center; }
        .lvl-tag { background: var(--main); color: white; padding: 5px 15px; border-radius: 50px; font-weight: 900; font-size: 12px; }

        .content { padding: 0 20px 100px 20px; max-width: 500px; margin: 0 auto; }

        /* GÖREV KARTLARI */
        .task-card { 
            background: var(--card); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; 
            align-items: center; transition: 0.3s;
        }
        .task-card:hover { border-color: var(--sub); transform: translateY(-5px); background: rgba(255, 255, 255, 0.1); }
        .task-card.done { opacity: 0.1; pointer-events: none; }

        .xp-text { color: var(--main); font-weight: bold; margin-left: auto; font-size: 14px; }

        /* ALT BAR */
        .footer-bar { 
            position: fixed; bottom: 0; width: 100%; background: rgba(11, 1, 20, 0.9); 
            backdrop-filter: blur(10px); border-top: 1px solid var(--main); padding: 15px;
            display: flex; justify-content: space-around;
        }

        input[type="text"], input[type="password"] {
            background: rgba(255,255,255,0.05); border: 1px solid #444; color: white;
            padding: 10px; border-radius: 10px; margin-bottom: 10px; width: 100%; outline: none;
        }
    </style>
</head>
<body>

<div id="auth-view">
    <div class="auth-card">
        <h1 style="color:var(--sub); letter-spacing:5px;">SİBER-GİRİŞ</h1>
        <input type="text" id="user-input" placeholder="Kullanıcı Adı">
        <input type="password" id="pass-input" placeholder="Erişim Şifresi">
        <button onclick="Auth.start()" style="background:var(--sub); border:none; padding:12px 30px; border-radius:10px; font-weight:bold; cursor:pointer; width:100%;">SİSTEMİ BAŞLAT</button>
    </div>
</div>

<div id="app-view" style="display:none;">
    <div class="header">
        <div>
            <h2 id="user-display" style="margin:0; font-size:18px;">AGENT</h2>
            <div id="coin-display" style="color:var(--sub); font-weight:bold;">0 XP</div>
        </div>
        <div class="lvl-tag" id="lvl-display">SEVİYE 1</div>
    </div>

    <div class="pet-box">
        <div id="pet-icon">🤖</div>
        <div id="pet-text">Sisteme hoş geldin dostum. Bugün hangi protokolleri tamamlıyoruz?</div>
    </div>

    <div class="content">
        <div id="task-list"></div>
    </div>

    <div class="footer-bar">
        <button onclick="Data.export()" style="background:none; border:1px solid var(--sub); color:var(--sub); padding:5px 15px; border-radius:10px; font-size:12px;">YEDEK AL</button>
        <button onclick="Auth.logout()" style="background:none; border:1px solid var(--main); color:var(--main); padding:5px 15px; border-radius:10px; font-size:12px;">ÇIKIŞ</button>
    </div>
</div>

<script>
// GÖREV LİSTESİ
const gorevler = [
    { ad: "Sıvı Entegrasyonu", detay: "Bir bardak su iç.", xp: 200, simge: "💧" },
    { ad: "Fiziksel Optimizasyon", detay: "10 şınav çek.", xp: 400, simge: "🦾" },
    { ad: "Zihinsel Durulama", detay: "2 dakika meditasyon yap.", xp: 150, simge: "🧘" },
    { ad: "Sistem Temizliği", detay: "Çalışma masanı toparla.", xp: 300, simge: "🧹" }
];

const petMesajlari = [
    "Harika gidiyorsun! Devam et.",
    "Biraz yorulmuş gibisin, su içmeye ne dersin?",
    "Vay canına! XP'ler akıyor.",
    "Sistem kararlılığı %100 dostum!",
    "Hadi, bir görev daha tamamlayalım!"
];

let player = null;

const Auth = {
    start: () => {
        const u = document.getElementById('user-input').value;
        const p = document.getElementById('pass-input').value;
        if(!u || !p) return alert("Bilgileri gir!");

        const kayıtlı = localStorage.getItem('cyber_v13_'+u);
        if(kayıtlı) {
            player = JSON.parse(kayıtlı);
            if(player.pass !== p) return alert("Yanlış şifre!");
        } else {
            player = { user: u, pass: p, xp: 0, lvl: 1, coins: 0, tamamlananlar: [] };
        }
        UI.init();
    },
    logout: () => location.reload()
};

const UI = {
    init: () => {
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        UI.render();
    },
    render: () => {
        document.getElementById('user-display').innerText = player.user.toUpperCase();
        document.getElementById('coin-display').innerText = player.coins + " XP";
        document.getElementById('lvl-display').innerText = "SEVİYE " + player.lvl;
        
        const liste = document.getElementById('task-list');
        liste.innerHTML = '';
        
        gorevler.forEach((g, i) => {
            const bitti = player.tamamlananlar.includes(i);
            liste.innerHTML += `
                <div class="task-card ${bitti ? 'done' : ''}" onclick="UI.tamamla(${i})">
                    <span style="font-size:30px; margin-right:20px;">${g.simge}</span>
                    <div>
                        <b style="color:var(--sub)">${g.ad}</b><br>
                        <small style="color:#888">${g.detay}</small>
                    </div>
                    <div class="xp-text">+${g.xp}</div>
                </div>
            `;
        });
    },
    tamamla: (i) => {
        if(player.tamamlananlar.includes(i)) return;
        player.tamamlananlar.push(i);
        player.coins += gorevler[i].xp;
        player.xp += gorevler[i].xp;

        // Rastgele pet mesajı
        document.getElementById('pet-text').innerText = petMesajlari[Math.floor(Math.random() * petMesajlari.length)];
        
        if(player.xp >= 1000) {
            player.lvl++;
            player.xp = 0;
            player.tamamlananlar = []; // Seviye atlayınca görevler sıfırlanır
            alert("TEBRİKLER! Seviye Atladın: " + player.lvl);
        }

        confetti({ particleCount: 150, spread: 70, origin: { y: 0.8 }, colors: ['#ff007a', '#00d4ff'] });
        Data.save();
        UI.render();
    }
};

const Data = {
    save: () => localStorage.setItem('cyber_v13_'+player.user, JSON.stringify(player)),
    export: () => {
        const veri = JSON.stringify(player);
        const blob = new Blob([veri], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `siber_yedek_${player.user}.json`;
        a.click();
    }
};
</script>
</body>
</html>
