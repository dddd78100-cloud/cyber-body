<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Core Elite V7</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff00e1; --bg: #050608; --card: #111; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        
        /* GİRİŞ EKRANI */
        #auth-view { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { background: rgba(255,255,255,0.03); border: 1px solid var(--neon); padding: 30px; border-radius: 25px; text-align: center; width: 100%; max-width: 350px; backdrop-filter: blur(10px); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; background: #000; color: white; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; background: var(--neon); color: black; margin-top: 10px; }

        /* ÜST BAR */
        .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; position: sticky; top: 0; background: rgba(5,6,8,0.9); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid #222; }
        .profile-trigger { display: flex; align-items: center; cursor: pointer; }
        .avatar-btn { width: 45px; height: 45px; background: linear-gradient(45deg, var(--neon), var(--pink)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; border: 2px solid rgba(255,255,255,0.2); }
        
        /* CÜZDAN (SHOP İÇİN) */
        .wallet { background: #1a1a1a; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--neon); color: var(--neon); font-size: 14px; font-weight: bold; }

        /* ANA İÇERİK */
        .content { padding: 20px; max-width: 450px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 25px; border: 1px solid #222; margin-bottom: 20px; position: relative; overflow: hidden; }
        .xp-bar { width: 100%; height: 8px; background: #000; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        #xp-fill { height: 100%; background: var(--neon); width: 0%; transition: 1s; box-shadow: 0 0 10px var(--neon); }

        /* MAĞAZA VE GÖREVLER */
        .section-title { font-size: 11px; color: #555; letter-spacing: 3px; margin: 25px 0 10px 5px; text-transform: uppercase; }
        .item-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .shop-item { background: #161616; padding: 15px; border-radius: 15px; border: 1px solid #222; text-align: center; cursor: pointer; transition: 0.3s; }
        .shop-item:hover { border-color: var(--pink); }

        .task { background: #161616; padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; border: 1px solid transparent; transition: 0.2s; }
        .task.done { opacity: 0.3; border-color: #10b981; filter: grayscale(1); }

        /* PROFİL MODAL */
        #profile-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #111; border: 1px solid var(--neon); padding: 30px; border-radius: 30px; width: 100%; max-width: 320px; text-align: center; }
    </style>
</head>
<body>

<div id="auth-view">
    <div class="auth-box">
        <h2 style="color:var(--neon); letter-spacing:5px;">CYBER-CORE</h2>
        <input type="text" id="user-input" placeholder="Kullanıcı Adı">
        <input type="password" id="pass-input" placeholder="Şifre">
        <button class="btn" onclick="handleAuth()">SİSTEME BAĞLAN</button>
        <p onclick="switchAuth()" id="switch-text" style="font-size:12px; color:#666; cursor:pointer; margin-top:15px;">Kayıt Ol</p>
    </div>
</div>

<div id="profile-modal">
    <div class="modal-content">
        <div id="modal-avatar" style="width:70px; height:70px; border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center; font-size:30px; background:var(--neon); color:black; font-weight:bold;">?</div>
        <h3 id="modal-name" style="margin:0;">AGENT</h3>
        <p id="modal-title" style="color:var(--pink); font-size:12px; margin-bottom:20px;">ACEMİ AJAN</p>
        <button class="btn" onclick="logout()" style="background:#222; color:white;">GÜVENLİ ÇIKIŞ</button>
        <button class="btn" onclick="closeProfile()" style="background:none; color:#555; border:1px solid #333;">KAPAT</button>
    </div>
</div>

<div id="app-view" style="display:none;">
    <div class="top-bar">
        <div class="profile-trigger" onclick="openProfile()">
            <div id="nav-avatar" class="avatar-btn">?</div>
            <div style="margin-left:12px">
                <div id="nav-name" style="font-weight:bold; font-size:14px;">AGENT</div>
                <div id="nav-lvl" style="font-size:11px; color:var(--neon)">LVL 1</div>
            </div>
        </div>
        <div class="wallet" id="user-coins">0 XP</div>
    </div>

    <div class="content">
        <div class="card">
            <div style="display:flex; justify-content:space-between; font-size:11px; color:#888;">
                <span>ENERJİ SEVİYESİ</span>
                <span id="xp-stat">0 / 1000</span>
            </div>
            <div class="xp-bar"><div id="xp-fill"></div></div>
        </div>

        <div class="section-title">GÖREV MERKEZİ</div>
        <div id="task-list"></div>

        <div class="section-title">SİBER MAĞAZA</div>
        <div class="item-list">
            <div class="shop-item" onclick="buyTitle('EFSANE', 2000)">
                <div style="font-size:20px">🎖️</div>
                <div style="font-size:12px; margin:5px 0;">Efsane Unvanı</div>
                <div style="color:var(--neon); font-size:10px;">2000 XP</div>
            </div>
            <div class="shop-item" onclick="buyColor('--neon', '#ff0000', 3000)">
                <div style="font-size:20px">🎨</div>
                <div style="font-size:12px; margin:5px 0;">Kırmızı Tema</div>
                <div style="color:var(--neon); font-size:10px;">3000 XP</div>
            </div>
        </div>
    </div>
</div>

<script>
    let isLoginMode = true;
    let player = null;
    const quests = [
        { id: 0, t: "Su Protokolü", d: "Hidrasyon sağla.", xp: 200, i: "💧" },
        { id: 1, t: "Sistem Reset", d: "5 dk mola ver.", xp: 300, i: "🔋" },
        { id: 2, t: "Kas Gücü", d: "10 şınav çek.", xp: 400, i: "🦾" }
    ];

    function handleAuth() {
        const u = document.getElementById('user-input').value.trim();
        const p = document.getElementById('pass-input').value.trim();
        if(!u || !p) return alert("Bilgileri gir!");

        if(isLoginMode) {
            const saved = localStorage.getItem('cyber_v7_' + u);
            if(saved && JSON.parse(saved).pass === p) {
                player = JSON.parse(saved);
                enterApp();
            } else { alert("Hatalı giriş!"); }
        } else {
            const data = { user: u, pass: p, xp: 0, lvl: 1, done: [], coins: 0, title: 'ACEMİ AJAN' };
            localStorage.setItem('cyber_v7_' + u, JSON.stringify(data));
            alert("Kayıt tamam!"); switchAuth();
        }
    }

    function switchAuth() {
        isLoginMode = !isLoginMode;
        document.getElementById('switch-text').innerText = isLoginMode ? "Kayıt Ol" : "Giriş Yap";
    }

    function enterApp() {
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        if(player.done.length >= quests.length) player.done = [];
        render();
    }

    function render() {
        document.getElementById('nav-avatar').innerText = player.user.charAt(0).toUpperCase();
        document.getElementById('nav-name').innerText = player.user.toUpperCase();
        document.getElementById('nav-lvl').innerText = "LVL " + player.lvl;
        document.getElementById('user-coins').innerText = player.coins + " XP";
        document.getElementById('xp-stat').innerText = player.xp + " / 1000";
        document.getElementById('xp-fill').style.width = (player.xp / 10) + "%";

        const list = document.getElementById('task-list');
        list.innerHTML = '';
        quests.forEach(q => {
            const isDone = player.done.includes(q.id);
            const div = document.createElement('div');
            div.className = `task ${isDone ? 'done' : ''}`;
            div.innerHTML = `<span style="font-size:24px; margin-right:15px">${q.i}</span>
                             <div style="flex:1"><b>${q.t}</b><br><small style="color:#555">${q.d}</small></div>
                             <div style="color:var(--neon)">+${q.xp}</div>`;
            div.onclick = () => {
                if(!isDone) {
                    player.done.push(q.id);
                    player.xp += q.xp;
                    player.coins += q.xp;
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.8 } });
                    if(player.xp >= 1000) { player.lvl++; player.xp -= 1000; }
                    save(); render();
                }
            };
            list.appendChild(div);
        });
    }

    function buyTitle(newTitle, price) {
        if(player.coins >= price) {
            player.coins -= price;
            player.title = newTitle;
            save(); render();
            alert("Yeni Unvanın: " + newTitle);
        } else { alert("Yetersiz XP!"); }
    }

    function buyColor(prop, val, price) {
        if(player.coins >= price) {
            player.coins -= price;
            document.documentElement.style.setProperty(prop, val);
            save(); render();
            alert("Tema Değişti!");
        } else { alert("Yetersiz XP!"); }
    }

    function save() { localStorage.setItem('cyber_v7_' + player.user, JSON.stringify(player)); }
    function openProfile() { 
        document.getElementById('profile-modal').style.display = 'flex'; 
        document.getElementById('modal-name').innerText = player.user.toUpperCase();
        document.getElementById('modal-avatar').innerText = player.user.charAt(0).toUpperCase();
        document.getElementById('modal-title').innerText = player.title;
    }
    function closeProfile() { document.getElementById('profile-modal').style.display = 'none'; }
    function logout() { location.reload(); }
</script>
</body>
</html>
